services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripmind
      POSTGRES_PASSWORD: tripmind
      POSTGRES_DB: tripmind
    ports:
      # Puerto del host configurable (TRIPMIND_DB_PORT en .env) por si 5432 está ocupado.
      - "${TRIPMIND_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
